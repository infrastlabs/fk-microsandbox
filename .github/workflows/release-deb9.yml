name: Release-deb9

on:
  push:
    branches: [ "main", "dev", "sam-custom" ]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LIBKRUNFW_VERSION: "5.2.1"
  LIBKRUNFW_ABI: "5"

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    # needs: [build-kernel, build-agentd-aarch64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04 #latest
            arch: x86_64
            os: linux
            agentd_target: x86_64-unknown-linux-musl
            libkrunfw_file: libkrunfw.so.5.2.1
            libkrunfw_asset: libkrunfw-linux-x86_64.so
            napi_target: x86_64-unknown-linux-gnu
            node_file: microsandbox.linux-x64-gnu.node
            npm_dir: linux-x64-gnu
          # - target: linux-aarch64
          #   runner: ubuntu-24.04-arm
          #   arch: aarch64
          #   os: linux
          #   agentd_target: aarch64-unknown-linux-musl
          #   libkrunfw_file: libkrunfw.so.5.2.1
          #   libkrunfw_asset: libkrunfw-linux-aarch64.so
          #   napi_target: aarch64-unknown-linux-gnu
          #   node_file: microsandbox.linux-arm64-gnu.node
          #   npm_dir: linux-arm64-gnu
          # - target: darwin-aarch64
          #   runner: macos-14
          #   arch: aarch64
          #   os: darwin
          #   agentd_target: ""
          #   libkrunfw_file: libkrunfw.5.dylib
          #   libkrunfw_asset: libkrunfw-darwin-aarch64.dylib
          #   napi_target: aarch64-apple-darwin
          #   node_file: microsandbox.darwin-arm64.node
          #   npm_dir: darwin-arm64
    if: always()
    runs-on: ${{ matrix.runner }}
      # image: debian:stretch
        # core-debian-9/10/11 #deb9:rust-lld: error: undefined symbol: copy_file_range; glibc-2.27+[ubt18]
        # core-ubuntu-16/18/20/22 #ubt18:todo
      # glib2.28@deb10 [2.31@ubt20; 2.31@same.deb11]; deb9.224/ubt16.223;
        # ubt26-2.43|ubt24-2.39|ubt22-2.35|ubt20-2.31|ubt18-2.27|ubt16-2.23|ubt14-2.19
        # deb13-2.41|deb12-2.36|deb11-2.31|deb10-2.28|deb9-2.24|deb8-2.19@2015
    container:
      # image: infrastlabs/x11-base:core-ubuntu-18.04 #core-debian-10 deb9
      image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/x11-base:core-debian-10 #core-ubuntu-18.04
      # --network host err: --network github_network_d8751a64d59f4356a176883d2cf5adf7 --network host --privileged
      options: --privileged

    steps:
      # - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      #   with:
      #     submodules: true
      - name: Init git
        run: |
          apt.sh git jq patch;
          # INFO
          pwd && ls -l
          free -h; df -h; ip a |grep inet; uname -a;
          # docker version
          # docker image prune -a -f; df -h
      # - uses: actions/checkout@v4 #v4.node20.glibcErr >v2; 还是node20:得glib2.28@deb10 [2.31@ubt20]
      - name: Checkout code manually
        run: |
          git config --global --add safe.directory /__w/fk-microsandbox/fk-microsandbox
          git clone https://github.com/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: Init submodules
        run: |
          git config --global --add safe.directory /__w/fk-microsandbox/fk-microsandbox
          git -c http.extraheader= submodule update --init --recursive
          # 
          # https://www.tutorialpedia.org/blog/how-do-i-deal-with-certificates-using-curl-while-trying-to-access-an-https-url/
          # update-ca-certificates #for rust-toolchain's curl, 加上后还不行(deb10/11, ubt10)
          # https://curl.se/docs/caextract.html
          cd /etc/ssl/certs; curl -O -k -fSL https://curl.se/ca/cacert-2026-05-14.pem
          ls -lh |wc
          update-ca-certificates
          # 
          # replace the static's curl
          apt update
          apt -y install --reinstall curl

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      #   with:
      #     cache-bin: false

      # -- Linux build deps --
      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools libcap-ng-dev gcc make flex bison libelf-dev bc python3-pyelftools

      # -- agentd (Linux: native musl) --
      - name: Build agentd (musl)
        if: matrix.os == 'linux'
        run: |
          rustup target add ${{ matrix.agentd_target }}
          cargo build --release --manifest-path crates/agentd/Cargo.toml --target ${{ matrix.agentd_target }}
          mkdir -p build
          cp target/${{ matrix.agentd_target }}/release/agentd build/agentd

      # -- agentd (macOS: download prebuilt Linux artifact) --
      # - name: Download agentd (macOS)
      #   if: matrix.os == 'darwin'
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      #   with:
      #     name: agentd-aarch64-linux-musl
      #     path: build/

      # -- libkrunfw (cached) --
      # - name: Cache libkrunfw
      #   id: cache-libkrunfw
      #   uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      #   with:
      #     path: build/libkrunfw*
      #     key: libkrunfw-${{ matrix.target }}-${{ hashFiles('vendor/libkrunfw/**') }}

      - name: Build libkrunfw (Linux)
        if: steps.cache-libkrunfw.outputs.cache-hit != 'true' && matrix.os == 'linux'
        run: |
          cd vendor/libkrunfw
          make -j$(nproc)
          cd ../..
          mkdir -p build
          cp vendor/libkrunfw/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }} build/
          cd build
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_VERSION }} libkrunfw.so.${{ env.LIBKRUNFW_ABI }}
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_ABI }} libkrunfw.so

      # - name: Download kernel.c (macOS)
      #   if: steps.cache-libkrunfw.outputs.cache-hit != 'true' && matrix.os == 'darwin'
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      #   with:
      #     name: kernel-c-aarch64
      #     path: vendor/libkrunfw/
      # - name: Build libkrunfw (macOS)
      #   if: steps.cache-libkrunfw.outputs.cache-hit != 'true' && matrix.os == 'darwin'
      #   run: |
      #     cd vendor/libkrunfw
      #     cc -fPIC -DABI_VERSION=${{ env.LIBKRUNFW_ABI }} -shared -o libkrunfw.${{ env.LIBKRUNFW_ABI }}.dylib kernel.c
      #     cd ../..
      #     mkdir -p build
      #     cp vendor/libkrunfw/libkrunfw.${{ env.LIBKRUNFW_ABI }}.dylib build/
      #     cd build
      #     ln -sf libkrunfw.${{ env.LIBKRUNFW_ABI }}.dylib libkrunfw.dylib

      # -- msb --
      - name: Build msb
        run: |
          cargo build --release --no-default-features --features net,ssh -p microsandbox-cli
          mkdir -p build
          cp target/release/msb build/msb

      # -- msb-metrics --
      - name: Build msb-metrics
        run: |
          cargo build --release -p microsandbox-metrics-collector
          mkdir -p build
          cp target/release/msb-metrics build/msb-metrics

      # -- Go FFI cdylib --
      - name: Build microsandbox-go
        run: |
          cargo build --release -p microsandbox-go
          mkdir -p build
          cp target/release/libmicrosandbox_go_ffi.so build/
          # if [ "${{ matrix.os }}" = "darwin" ]; then
          #   cp target/release/libmicrosandbox_go_ffi.dylib build/
          # else
          #   cp target/release/libmicrosandbox_go_ffi.so build/
          # fi

      # -- macOS codesign --
      # - name: Codesign msb
      #   if: matrix.os == 'darwin'
      #   run: codesign --entitlements msb-entitlements.plist --force -s - build/msb


      # -- Stage release artifacts --
      - name: Stage artifacts
        run: |
          mkdir -p artifacts

          # Standalone msb
          cp build/msb artifacts/msb-${{ matrix.target }}

          # Standalone msb-metrics
          cp build/msb-metrics artifacts/msb-metrics-${{ matrix.target }}

          # Standalone libkrunfw
          cp build/${{ matrix.libkrunfw_file }} artifacts/${{ matrix.libkrunfw_asset }}

          # Standalone agentd (Linux only — guest binary)
          if [ "${{ matrix.os }}" = "linux" ]; then
            cp build/agentd artifacts/agentd-${{ matrix.arch }}
          fi

          # Bundle: msb + libkrunfw + Go FFI cdylib
          if [ "${{ matrix.os }}" = "darwin" ]; then
            go_ffi_file=libmicrosandbox_go_ffi.dylib
          else
            go_ffi_file=libmicrosandbox_go_ffi.so
          fi
          tar -czf artifacts/microsandbox-${{ matrix.target }}.tar.gz \
            -C build msb ${{ matrix.libkrunfw_file }} $go_ffi_file

          # # Standalone Go FFI cdylib named to match sdk/go/internal/bundle/
          # # bundles/ so the go-sdk-tag job can drop it in directly.
          # case "${{ matrix.target }}" in
          #   linux-x86_64)   bundle_name=libmicrosandbox_go_ffi-linux-amd64.so ;;
          #   linux-aarch64)  bundle_name=libmicrosandbox_go_ffi-linux-arm64.so ;;
          #   darwin-aarch64) bundle_name=libmicrosandbox_go_ffi-darwin-arm64.dylib ;;
          # esac
          # cp "build/$go_ffi_file" "artifacts/$bundle_name"

      # - name: Upload artifacts
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: release-${{ matrix.target }}
      #     path: artifacts/

      - name: Create or get release
        id: create_release
        run: |
          TAG_NAME=v26.06 #${GITHUB_REF#refs/tags/}
          # 1. 先尝试查询是否已存在
          existing_response=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME" 2>/dev/null || echo "")
          release_id=$(echo "$existing_response" | jq -r '.id // empty')
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            # 2. 已存在，直接复用
            echo "release_id=$release_id" >> $GITHUB_OUTPUT
            echo "Found existing release with ID: $release_id"
          else
            # 3. 不存在，创建新 Release
            echo "Release not found, creating new one..."
            create_response=$(curl -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/releases \
              -d "{
                \"tag_name\": \"$TAG_NAME\",
                \"name\": \"Release $TAG_NAME\",
                \"body\": \"Release notes for $TAG_NAME\",
                \"draft\": false,
                \"prerelease\": false
              }")
            release_id=$(echo "$create_response" | jq -r '.id')
            echo "release_id=$release_id" >> $GITHUB_OUTPUT
            echo "Created new release with ID: $release_id"
          fi

      - name: Upload Asset
        run: |
          # ${{ matrix.target }}=linux-x86_64
          # artifacts/microsandbox-linux-x86_64.tar.gz
          F=microsandbox-linux-x86_64.tar.gz #${{ env.ASSET }}
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=$F" \
            --data-binary @./artifacts/$F



